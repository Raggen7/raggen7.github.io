<!DOCTYPE html>
<html>

<head>
    <title>Raggen7 Software</title>

    <link rel="icon" type="image/png" href="raggen7.png">

    <style>

        body {
            background-color: #0f172a;
            color: white;
            font-family: "Segoe UI", Arial, sans-serif;
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 220px;
            filter: drop-shadow(0 0 15px #00c8ff);
        }

        h1 {
            color: #00c8ff;
            font-size: 48px;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        h2 {
            color: #b0c4de;
            font-weight: normal;
            margin-top: 0;
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }

        .card h3 {
            color: #00c8ff;
            margin-top: 0;
        }

        .button {
            background: #00c8ff;
            color: black;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
        }

        .button:hover {
            background: #4ddfff;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            margin-top: 50px;
        }

    </style>

</head>

<body>

    <div class="header">

        <img src="raggen7.png" class="logo" alt="Raggen7 Logo">

        <h1>RAGGEN7 SOFTWARE</h1>

        <h2>Windows Tools & Utilities</h2>

    </div>

    <div class="catalog">

        <div class="card">

            <h3>Raggen7 LG TV YouTube AdFree</h3>

            <p>
                Install an ad-free YouTube client on compatible LG webOS TVs.
            </p>

            <a class="button" href="lgtv.html">
                Open
            </a>

        </div>

    </div>

    <div class="footer">

        Ragnar Næss © 2026<br>
        Raggen7 Software

    </div>

</body>
</html>
